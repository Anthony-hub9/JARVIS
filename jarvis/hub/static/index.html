<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>J.A.R.V.I.S. — HUD Local</title>
  <style>
    :root {
      --bg: #050a12;
      --bg-radial: radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.12), transparent 55%);
      --surface: rgba(9, 18, 32, 0.88);
      --surface-2: rgba(14, 27, 46, 0.92);
      --border: rgba(0, 212, 255, 0.22);
      --border-strong: rgba(0, 212, 255, 0.55);
      --text: #e6f6ff;
      --muted: #7ba3be;
      --cyan: #00d4ff;
      --cyan-dim: rgba(0, 212, 255, 0.14);
      --cyan-glow: 0 0 18px rgba(0, 212, 255, 0.42);
      --ok: #22c55e;
      --ok-bg: rgba(34, 197, 94, 0.14);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.15);
      --err: #ef4444;
      --err-bg: rgba(239, 68, 68, 0.16);
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      background-image:
        var(--bg-radial),
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .hud-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 1040px;
      margin: 0 auto;
      border-left: 1px solid rgba(0, 212, 255, 0.1);
      border-right: 1px solid rgba(0, 212, 255, 0.1);
      background: rgba(5, 10, 18, 0.72);
      backdrop-filter: blur(8px);
    }

    /* Top HUD Status Bar */
    .hud-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .hud-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    /* Arc Reactor Orb */
    .reactor-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .reactor-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(0, 212, 255, 0.35);
      border-top-color: var(--cyan);
      border-bottom-color: var(--cyan);
      animation: spinSlow 9s linear infinite;
    }

    .reactor-ring-inner {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1.5px dashed rgba(0, 212, 255, 0.6);
      animation: spinReverse 6s linear infinite;
    }

    .reactor-core {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, var(--cyan) 60%, rgba(0, 212, 255, 0.1) 100%);
      box-shadow: 0 0 14px var(--cyan), 0 0 28px rgba(0, 212, 255, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .reactor-wrap[data-state="idle"] .reactor-core {
      animation: pulseIdle 3s ease-in-out infinite;
    }

    .reactor-wrap[data-state="listening"] .reactor-ring {
      border-top-color: #22c55e;
      border-bottom-color: #22c55e;
      animation-duration: 2.2s;
    }
    .reactor-wrap[data-state="listening"] .reactor-core {
      background: radial-gradient(circle, #ffffff 0%, #22c55e 65%, rgba(34, 197, 94, 0.1) 100%);
      box-shadow: 0 0 18px #22c55e, 0 0 34px rgba(34, 197, 94, 0.55);
      animation: pulseActive 0.9s ease-in-out infinite;
    }

    .reactor-wrap[data-state="thinking"] .reactor-ring {
      border-top-color: #f59e0b;
      border-bottom-color: #00d4ff;
      animation-duration: 1.1s;
    }
    .reactor-wrap[data-state="thinking"] .reactor-ring-inner {
      animation-duration: 1.4s;
    }
    .reactor-wrap[data-state="thinking"] .reactor-core {
      background: radial-gradient(circle, #ffffff 0%, #f59e0b 65%, rgba(245, 158, 11, 0.1) 100%);
      box-shadow: 0 0 18px #f59e0b, 0 0 32px rgba(245, 158, 11, 0.55);
      animation: pulseActive 0.7s ease-in-out infinite;
    }

    .reactor-wrap[data-state="speaking"] .reactor-ring {
      animation-duration: 1.6s;
    }
    .reactor-wrap[data-state="speaking"] .reactor-core {
      animation: pulseSpeak 0.42s ease-in-out infinite alternate;
      box-shadow: 0 0 22px var(--cyan), 0 0 40px rgba(0, 212, 255, 0.8);
    }

    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }
    @keyframes pulseIdle {
      0%, 100% { transform: scale(0.95); opacity: 0.88; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes pulseActive {
      0%, 100% { transform: scale(0.9); }
      50% { transform: scale(1.18); }
    }
    @keyframes pulseSpeak {
      from { transform: scale(0.92); }
      to { transform: scale(1.26); }
    }

    .brand-meta h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 8px var(--warn);
      flex-shrink: 0;
    }
    .dot.connected { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.disconnected { background: var(--err); box-shadow: 0 0 8px var(--err); }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .model-telemetry {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      padding: 4px 14px;
      background: rgba(0, 212, 255, 0.04);
      border-bottom: 1px solid rgba(0, 212, 255, 0.14);
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .telemetry-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(0, 212, 255, 0.22);
      background: rgba(0, 212, 255, 0.07);
      color: #b7ecff;
    }

    select, button, input, textarea {
      font: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    button, select {
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    select {
      padding: 6px 10px;
      font-size: 13px;
      min-height: 38px;
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 40px;
      min-height: 38px;
      padding: 0 11px;
      font-size: 13px;
    }

    .hud-btn:hover:not(:disabled), select:hover {
      border-color: var(--border-strong);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.18);
    }

    .hud-btn.active {
      background: var(--cyan-dim);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: var(--cyan-glow);
    }

    .hud-btn.listening {
      background: var(--ok-bg);
      border-color: var(--ok);
      color: #86efac;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.4);
    }

    .hud-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Navigation Tabs */
    .hud-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px 14px;
      background: rgba(8, 15, 28, 0.9);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 10px;
    }

    .tab-btn.active {
      background: var(--cyan-dim);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.22);
    }

    /* Panels */
    .tab-panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .tab-panel.active {
      display: flex;
    }

    /* Chat Panel */
    .chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 86%;
      gap: 5px;
    }

    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg.system {
      align-self: center;
      max-width: 96%;
      align-items: center;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, #0b4f8a, #083460);
      border: 1px solid rgba(0, 212, 255, 0.4);
      color: #f0faff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: inset 0 0 18px rgba(0, 212, 255, 0.04);
    }

    .msg.system .bubble {
      background: rgba(0, 212, 255, 0.06);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
      padding: 6px 12px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .badge.ok { background: var(--ok-bg); color: #86efac; border-color: rgba(34, 197, 94, 0.35); }
    .badge.warn { background: var(--warn-bg); color: #fcd34d; border-color: rgba(245, 158, 11, 0.35); }
    .badge.err { background: var(--err-bg); color: #fca5a5; border-color: rgba(239, 68, 68, 0.35); }
    .badge.neutral { background: rgba(0, 212, 255, 0.08); color: var(--muted); border-color: var(--border); }

    .tool-box {
      margin-top: 4px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(4, 9, 17, 0.9);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
      color: #a5e8ff;
      max-width: 100%;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .quick-bar {
      display: flex;
      gap: 7px;
      padding: 8px 14px 4px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .chip {
      white-space: nowrap;
      padding: 6px 11px;
      font-size: 12px;
      border-radius: 999px;
      background: rgba(0, 212, 255, 0.07);
      border: 1px solid var(--border);
      color: #bceeff;
    }

    .chip:hover {
      border-color: var(--cyan);
      background: var(--cyan-dim);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 130px;
      padding: 10px 12px;
      line-height: 1.35;
    }

    .composer textarea:focus,
    .panel-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.16);
    }

    .send-btn {
      min-height: 44px;
      padding: 0 16px;
      background: linear-gradient(135deg, #00b8e6, #0077b6);
      border-color: var(--cyan);
      color: #03101c;
      font-weight: 700;
    }

    .send-btn:hover:not(:disabled) {
      box-shadow: var(--cyan-glow);
    }

    /* Drawer / Secondary Panels (Agenda & Apps) */
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hud-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hud-card-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: 1.2fr 1fr 1fr auto;
        align-items: center;
      }
    }

    .panel-input {
      padding: 9px 11px;
      min-height: 40px;
      font-size: 14px;
      width: 100%;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid rgba(0, 212, 255, 0.16);
    }

    .list-row-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .list-row-title {
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    .list-row-sub {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .row-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-open {
      background: rgba(0, 212, 255, 0.12);
      border-color: rgba(0, 212, 255, 0.45);
      color: var(--cyan);
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-close {
      background: var(--err-bg);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
    }

    .feedback-line {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--cyan);
      min-height: 18px;
    }

    @media (max-width: 520px) {
      .msg { max-width: 94%; }
      .hud-header { padding: 10px 12px; }
      .brand-meta h1 { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="hud-shell">
    <header class="hud-header">
      <div class="hud-identity">
        <div class="reactor-wrap" id="reactorOrb" data-state="idle" title="Estado del núcleo JARVIS">
          <div class="reactor-ring"></div>
          <div class="reactor-ring-inner"></div>
          <div class="reactor-core"></div>
        </div>
        <div class="brand-meta">
          <h1>J.A.R.V.I.S. // HUD</h1>
          <div class="status-line">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Inicializando...</span>
          </div>
        </div>
      </div>

      <div class="hud-controls">
        <select id="deviceSelect" aria-label="Dispositivo">
          <option value="laptop">Laptop</option>
          <option value="s24-plus">Galaxy S24+</option>
        </select>
        <button id="ttsToggle" class="hud-btn active" type="button" title="Activar o silenciar voz de JARVIS">🔊 Voz</button>
      </div>
    </header>

    <div class="model-telemetry" id="modelTelemetry">
      <span class="telemetry-pill">NÚCLEO: <strong id="hudStateLabel">IDLE</strong></span>
      <span class="telemetry-pill">BACKEND: <span id="healthBackend">ollama</span></span>
      <span class="telemetry-pill">EXEC: <span id="healthExec">...</span></span>
      <span class="telemetry-pill">SUP: <span id="healthSup">...</span></span>
      <span class="telemetry-pill">VISION: <span id="healthVision">...</span></span>
    </div>

    <nav class="hud-tabs" role="tablist">
      <button class="tab-btn active" data-tab="chat" type="button" role="tab">Chat</button>
      <button class="tab-btn" data-tab="agenda" type="button" role="tab">Agenda</button>
      <button class="tab-btn" data-tab="apps" type="button" role="tab">Apps</button>
    </nav>

    <!-- CHAT TAB -->
    <section id="panel-chat" class="tab-panel active">
      <main id="chatFeed" class="chat-feed" aria-live="polite"></main>

      <div class="quick-bar">
        <button class="chip" type="button" data-send="¿Qué tengo en mi agenda?">📅 Agenda</button>
        <button class="chip" type="button" data-send="Lista las aplicaciones disponibles">🧩 Apps</button>
        <button class="chip" type="button" data-fill="Recuérdame ">⏰ Recordatorio</button>
        <button class="chip" type="button" data-fill="Abre ">🚀 Abrir app</button>
      </div>

      <form id="composer" class="composer">
        <button id="micBtn" class="hud-btn" type="button" title="Entrada por voz">🎤</button>
        <textarea id="promptInput" rows="1" placeholder="Ordena a JARVIS..."></textarea>
        <button id="sendBtn" class="hud-btn send-btn" type="submit">Enviar</button>
      </form>
    </section>

    <!-- AGENDA TAB -->
    <section id="panel-agenda" class="tab-panel">
      <div class="panel-body">
        <div class="hud-card">
          <div class="hud-card-header">
            <span class="hud-card-title">Nuevo Recordatorio</span>
          </div>
          <form id="agendaForm" class="form-grid">
            <input id="agendaTitle" class="panel-input" type="text" placeholder="Título (ej. Junta de equipo)" required />
            <input id="agendaWhen" class="panel-input" type="datetime-local" required />
            <input id="agendaNotes" class="panel-input" type="text" placeholder="Notas opcionales" />
            <button class="hud-btn send-btn" type="submit">Agendar</button>
          </form>
          <div id="agendaFeedback" class="feedback-line"></div>
        </div>

        <div class="hud-card">
          <div class="hud-card-header">
            <span class="hud-card-title">Eventos en Agenda</span>
            <div class="row-actions">
              <button id="agendaUpcomingToggle" class="hud-btn" type="button">Solo próximos</button>
              <button id="agendaRefreshBtn" class="hud-btn" type="button">↻ Actualizar</button>
            </div>
          </div>
          <div id="agendaList" class="item-list"></div>
        </div>
      </div>
    </section>

    <!-- APPS TAB -->
    <section id="panel-apps" class="tab-panel">
      <div class="panel-body">
        <div class="hud-card">
          <div class="hud-card-header">
            <span class="hud-card-title">Control de Aplicaciones</span>
            <button id="appsRefreshBtn" class="hud-btn" type="button">↻ Escanear</button>
          </div>
          <input id="appsSearch" class="panel-input" type="search" placeholder="Buscar aplicación (ej. notepad, chrome, spotify)..." />
          <div id="appsFeedback" class="feedback-line"></div>
          <div id="appsList" class="item-list"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const reactorOrb = document.getElementById("reactorOrb");
      const hudStateLabel = document.getElementById("hudStateLabel");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const deviceSelect = document.getElementById("deviceSelect");
      const ttsToggle = document.getElementById("ttsToggle");

      const healthBackend = document.getElementById("healthBackend");
      const healthExec = document.getElementById("healthExec");
      const healthSup = document.getElementById("healthSup");
      const healthVision = document.getElementById("healthVision");

      const chatFeed = document.getElementById("chatFeed");
      const composer = document.getElementById("composer");
      const promptInput = document.getElementById("promptInput");
      const sendBtn = document.getElementById("sendBtn");
      const micBtn = document.getElementById("micBtn");

      const agendaForm = document.getElementById("agendaForm");
      const agendaTitle = document.getElementById("agendaTitle");
      const agendaWhen = document.getElementById("agendaWhen");
      const agendaNotes = document.getElementById("agendaNotes");
      const agendaList = document.getElementById("agendaList");
      const agendaFeedback = document.getElementById("agendaFeedback");
      const agendaUpcomingToggle = document.getElementById("agendaUpcomingToggle");
      const agendaRefreshBtn = document.getElementById("agendaRefreshBtn");

      const appsSearch = document.getElementById("appsSearch");
      const appsList = document.getElementById("appsList");
      const appsFeedback = document.getElementById("appsFeedback");
      const appsRefreshBtn = document.getElementById("appsRefreshBtn");

      let ws = null;
      let reconnectTimer = null;
      let pendingEl = null;
      let userHasInteracted = false;
      let ttsEnabled = localStorage.getItem("jarvis_tts") !== "0";
      let activeAudio = null;
      let activeAudioUrl = null;
      let upcomingOnly = false;
      let cachedApps = [];

      const savedDevice = localStorage.getItem("jarvis_device_id");
      if (savedDevice && (savedDevice === "laptop" || savedDevice === "s24-plus")) {
        deviceSelect.value = savedDevice;
      } else if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
        deviceSelect.value = "s24-plus";
      }

      function setOrbState(state) {
        reactorOrb.setAttribute("data-state", state);
        hudStateLabel.textContent = state.toUpperCase();
      }

      function setStatus(stateClass, text) {
        statusDot.className = "dot" + (stateClass ? " " + stateClass : "");
        statusText.textContent = text;
      }

      // Mark user gesture to allow audio playback
      function markGesture() {
        userHasInteracted = true;
      }
      document.addEventListener("pointerdown", markGesture, { once: true });
      document.addEventListener("keydown", markGesture, { once: true });

      // Tabs
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = btn.getAttribute("data-tab");
          document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
          document.querySelectorAll(".tab-panel").forEach((p) => {
            p.classList.toggle("active", p.id === `panel-${target}`);
          });
          if (target === "agenda") loadAgenda();
          if (target === "apps") loadApps();
        });
      });

      // Health / Ollama Telemetry
      async function loadHealth() {
        try {
          const resp = await fetch("/health");
          if (!resp.ok) return;
          const data = await resp.json();
          healthBackend.textContent = data.backend || "ollama";
          healthExec.textContent = data.executor || "-";
          healthSup.textContent = data.supervisor || "-";
          healthVision.textContent = data.vision || "-";
        } catch {
          healthExec.textContent = "offline";
        }
      }

      // Chat UI helpers
      function scrollToBottom() {
        chatFeed.scrollTop = chatFeed.scrollHeight;
      }

      function addSystemMessage(text) {
        const wrap = document.createElement("div");
        wrap.className = "msg system";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrap.appendChild(bubble);
        chatFeed.appendChild(wrap);
        scrollToBottom();
      }

      function addUserMessage(text) {
        const wrap = document.createElement("div");
        wrap.className = "msg user";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrap.appendChild(bubble);
        chatFeed.appendChild(wrap);
        scrollToBottom();
      }

      function showPending() {
        removePending();
        const wrap = document.createElement("div");
        wrap.className = "msg system";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = "Procesando con núcleos locales...";
        wrap.appendChild(bubble);
        chatFeed.appendChild(wrap);
        pendingEl = wrap;
        setOrbState("thinking");
        scrollToBottom();
      }

      function removePending() {
        if (pendingEl) {
          pendingEl.remove();
          pendingEl = null;
        }
      }

      function addBotMessage(data) {
        removePending();
        const wrap = document.createElement("div");
        wrap.className = "msg bot";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = data.response || "(Sin respuesta)";
        wrap.appendChild(bubble);

        if (data.tool_result) {
          const toolBox = document.createElement("pre");
          toolBox.className = "tool-box";
          toolBox.textContent = JSON.stringify(data.tool_result, null, 2);
          wrap.appendChild(toolBox);
        }

        const meta = document.createElement("div");
        meta.className = "meta";

        const supBadge = document.createElement("span");
        if (data.circuit_broken) {
          supBadge.className = "badge err";
          supBadge.textContent = "⚡ Circuit Breaker";
        } else if (data.approved) {
          supBadge.className = "badge ok";
          supBadge.textContent = "✓ Aprobado";
        } else {
          supBadge.className = "badge warn";
          supBadge.textContent = "⚠ No aprobado";
        }
        meta.appendChild(supBadge);

        if (typeof data.attempts === "number") {
          const attBadge = document.createElement("span");
          attBadge.className = "badge neutral";
          attBadge.textContent = `Intentos: ${data.attempts}`;
          meta.appendChild(attBadge);
        }

        wrap.appendChild(meta);
        chatFeed.appendChild(wrap);
        scrollToBottom();

        if (ttsEnabled && userHasInteracted && data.response) {
          speak(data.response);
        } else {
          setOrbState("idle");
        }
      }

      // WebSocket
      function connect() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        if (ws) {
          ws.onclose = null;
          ws.close();
          ws = null;
        }

        const deviceId = encodeURIComponent(deviceSelect.value);
        const wsProto = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${wsProto}//${window.location.host}/ws/${deviceId}`;

        setStatus("", `Conectando (${deviceSelect.value})...`);
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          setStatus("connected", `ONLINE · ${deviceSelect.value}`);
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            addBotMessage(data);
          } catch {
            addBotMessage({ response: String(event.data), approved: true });
          }
          sendBtn.disabled = false;
        };

        ws.onerror = () => {
          setStatus("disconnected", "ERROR DE ENLACE");
        };

        ws.onclose = () => {
          removePending();
          sendBtn.disabled = false;
          setOrbState("idle");
          setStatus("disconnected", "DESCONECTADO · reintentando...");
          reconnectTimer = setTimeout(connect, 2500);
        };
      }

      function sendMessage(text) {
        markGesture();
        const clean = text.trim();
        if (!clean) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          addSystemMessage("Sin conexión con el servidor. Reintentando...");
          connect();
          return;
        }
        addUserMessage(clean);
        showPending();
        sendBtn.disabled = true;
        ws.send(clean);
        promptInput.value = "";
        promptInput.style.height = "auto";
      }

      deviceSelect.addEventListener("change", () => {
        localStorage.setItem("jarvis_device_id", deviceSelect.value);
        addSystemMessage(`Cambiando enlace a ${deviceSelect.value}...`);
        connect();
      });

      composer.addEventListener("submit", (e) => {
        e.preventDefault();
        sendMessage(promptInput.value);
      });

      promptInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage(promptInput.value);
        }
      });

      promptInput.addEventListener("input", () => {
        promptInput.style.height = "auto";
        promptInput.style.height = Math.min(promptInput.scrollHeight, 130) + "px";
      });

      document.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          const toSend = btn.getAttribute("data-send");
          const toFill = btn.getAttribute("data-fill");
          if (toSend) {
            sendMessage(toSend);
          } else if (toFill) {
            promptInput.value = toFill;
            promptInput.focus();
          }
        });
      });

      // Voice Output: Local /api/tts WAV -> fallback window.speechSynthesis
      function stopAudio() {
        if (activeAudio) {
          activeAudio.pause();
          activeAudio = null;
        }
        if (activeAudioUrl) {
          URL.revokeObjectURL(activeAudioUrl);
          activeAudioUrl = null;
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      }

      function updateTtsButton() {
        ttsToggle.classList.toggle("active", ttsEnabled);
        ttsToggle.textContent = ttsEnabled ? "🔊 Voz" : "🔇 Voz";
      }

      function speakWithBrowserFallback(text) {
        if (!("speechSynthesis" in window)) {
          setOrbState("idle");
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const esVoice =
          voices.find((v) => v.lang.toLowerCase().startsWith("es-mx")) ||
          voices.find((v) => v.lang.toLowerCase().startsWith("es-es")) ||
          voices.find((v) => v.lang.toLowerCase().startsWith("es"));
        if (esVoice) {
          utter.voice = esVoice;
          utter.lang = esVoice.lang;
        } else {
          utter.lang = "es-MX";
        }
        utter.onstart = () => setOrbState("speaking");
        utter.onend = () => setOrbState("idle");
        utter.onerror = () => setOrbState("idle");
        window.speechSynthesis.speak(utter);
      }

      async function speak(text) {
        stopAudio();
        const trimmed = (text || "").trim().slice(0, 800);
        if (!trimmed) {
          setOrbState("idle");
          return;
        }
        try {
          setOrbState("speaking");
          const resp = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: trimmed }),
          });
          if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}`);
          }
          const blob = await resp.blob();
          activeAudioUrl = URL.createObjectURL(blob);
          const audio = new Audio(activeAudioUrl);
          activeAudio = audio;
          audio.onended = () => {
            stopAudio();
            setOrbState("idle");
          };
          audio.onerror = () => {
            stopAudio();
            speakWithBrowserFallback(trimmed);
          };
          await audio.play();
        } catch {
          speakWithBrowserFallback(trimmed);
        }
      }

      ttsToggle.addEventListener("click", () => {
        markGesture();
        ttsEnabled = !ttsEnabled;
        localStorage.setItem("jarvis_tts", ttsEnabled ? "1" : "0");
        if (!ttsEnabled) {
          stopAudio();
          setOrbState("idle");
        }
        updateTtsButton();
      });

      // Voice Input (STT)
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;
      let listening = false;

      if (!SpeechRecognition) {
        micBtn.disabled = true;
        micBtn.title = "Entrada de voz no soportada en este navegador.";
      } else if (!window.isSecureContext) {
        micBtn.disabled = true;
        micBtn.title = "El micrófono requiere HTTPS o localhost.";
      } else {
        recognition = new SpeechRecognition();
        recognition.lang = "es-MX";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          listening = true;
          micBtn.classList.add("listening");
          setOrbState("listening");
          micBtn.title = "Escuchando... toca para detener";
        };

        recognition.onend = () => {
          listening = false;
          micBtn.classList.remove("listening");
          if (reactorOrb.getAttribute("data-state") === "listening") {
            setOrbState("idle");
          }
          micBtn.title = "Hablar con JARVIS";
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0]?.[0]?.transcript || "";
          if (transcript.trim()) {
            sendMessage(transcript);
          }
        };

        recognition.onerror = (event) => {
          listening = false;
          micBtn.classList.remove("listening");
          setOrbState("idle");
          if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            micBtn.disabled = true;
            micBtn.title = "Permiso de micrófono denegado o bloqueado por HTTP.";
          }
        };

        micBtn.title = "Hablar con JARVIS";
        micBtn.addEventListener("click", () => {
          markGesture();
          if (listening) {
            recognition.stop();
          } else {
            recognition.start();
          }
        });
      }

      // Agenda Drawer
      async function loadAgenda() {
        agendaFeedback.textContent = "Cargando agenda...";
        try {
          const resp = await fetch(`/api/agenda?upcoming=${upcomingOnly ? "true" : "false"}`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          const events = data.events || [];
          agendaList.innerHTML = "";
          if (!events.length) {
            const empty = document.createElement("div");
            empty.className = "list-row";
            empty.textContent = upcomingOnly ? "No hay eventos próximos." : "La agenda está vacía.";
            agendaList.appendChild(empty);
          } else {
            events.forEach((ev) => {
              const row = document.createElement("div");
              row.className = "list-row";
              const main = document.createElement("div");
              main.className = "list-row-main";
              const title = document.createElement("div");
              title.className = "list-row-title";
              title.textContent = ev.title;
              const sub = document.createElement("div");
              sub.className = "list-row-sub";
              sub.textContent = ev.notes ? `${ev.when} · ${ev.notes}` : ev.when;
              main.appendChild(title);
              main.appendChild(sub);
              row.appendChild(main);
              agendaList.appendChild(row);
            });
          }
          agendaFeedback.textContent = `${events.length} evento(s) cargados.`;
        } catch (err) {
          agendaFeedback.textContent = `Error al cargar agenda: ${err.message}`;
        }
      }

      agendaUpcomingToggle.addEventListener("click", () => {
        upcomingOnly = !upcomingOnly;
        agendaUpcomingToggle.classList.toggle("active", upcomingOnly);
        loadAgenda();
      });

      agendaRefreshBtn.addEventListener("click", loadAgenda);

      agendaForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = agendaTitle.value.trim();
        const when = agendaWhen.value.trim();
        const notes = agendaNotes.value.trim();
        if (!title || !when) return;
        agendaFeedback.textContent = "Guardando...";
        try {
          const resp = await fetch("/api/agenda", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, when, notes }),
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          agendaTitle.value = "";
          agendaNotes.value = "";
          agendaFeedback.textContent = "Recordatorio guardado.";
          await loadAgenda();
        } catch (err) {
          agendaFeedback.textContent = `Error al guardar: ${err.message}`;
        }
      });

      // Apps Drawer
      function renderApps(filterText) {
        const q = (filterText || "").trim().toLowerCase();
        const filtered = q
          ? cachedApps.filter((name) => name.toLowerCase().includes(q))
          : cachedApps;

        appsList.innerHTML = "";
        if (!filtered.length) {
          const empty = document.createElement("div");
          empty.className = "list-row";
          empty.textContent = "No se encontraron aplicaciones.";
          appsList.appendChild(empty);
          return;
        }

        filtered.forEach((appName) => {
          const row = document.createElement("div");
          row.className = "list-row";

          const main = document.createElement("div");
          main.className = "list-row-main";
          const title = document.createElement("div");
          title.className = "list-row-title";
          title.textContent = appName;
          main.appendChild(title);

          const actions = document.createElement("div");
          actions.className = "row-actions";

          const openBtn = document.createElement("button");
          openBtn.type = "button";
          openBtn.className = "hud-btn btn-open";
          openBtn.textContent = "Abrir";
          openBtn.addEventListener("click", () => triggerAppAction("open", appName));

          const closeBtn = document.createElement("button");
          closeBtn.type = "button";
          closeBtn.className = "hud-btn btn-close";
          closeBtn.textContent = "Cerrar";
          closeBtn.addEventListener("click", () => triggerAppAction("close", appName));

          actions.appendChild(openBtn);
          actions.appendChild(closeBtn);
          row.appendChild(main);
          row.appendChild(actions);
          appsList.appendChild(row);
        });
      }

      async function loadApps() {
        appsFeedback.textContent = "Cargando aplicaciones...";
        try {
          const resp = await fetch("/api/apps");
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          cachedApps = data.apps || [];
          renderApps(appsSearch.value);
          appsFeedback.textContent = `${cachedApps.length} aplicación(es) disponibles.`;
        } catch (err) {
          appsFeedback.textContent = `Error al cargar apps: ${err.message}`;
        }
      }

      async function triggerAppAction(action, appName) {
        appsFeedback.textContent = `${action === "open" ? "Abriendo" : "Cerrando"} ${appName}...`;
        try {
          const resp = await fetch(`/api/apps/${action}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ app_name: appName }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            throw new Error(data.detail || `HTTP ${resp.status}`);
          }
          appsFeedback.textContent =
            action === "open"
              ? `✓ ${appName} iniciada.`
              : `✓ ${appName} cerrada (código ${data.returncode ?? 0}).`;
        } catch (err) {
          appsFeedback.textContent = `Error: ${err.message}`;
        }
      }

      appsSearch.addEventListener("input", () => renderApps(appsSearch.value));
      appsRefreshBtn.addEventListener("click", loadApps);

      // Init
      updateTtsButton();
      loadHealth();
      connect();
    })();
  </script>
</body>
</html>
