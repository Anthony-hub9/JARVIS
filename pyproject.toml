[project]
name = "jarvis-hub"
version = "0.1.0"
description = "JARVIS Hub Central - Doble Agente local (Ollama) con FastAPI y WebSockets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.0",
    "ddgs>=9.0.0",
    "pystray>=0.19.0",
    "pillow>=10.0.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
